name: .NET Build and Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: >
          dotnet restore src/Api/ src/Worker/ src/Domain/ src/Application/ src/Infrastructure/
      - name: Build
        run: >
          dotnet build src/Api/ src/Worker/ src/Domain/ src/Application/ src/Infrastructure/ --no-restore --configuration Release
      - name: Run tests
        run: >
          dotnet test tests/Unit/ --no-build --verbosity normal --configuration Release
